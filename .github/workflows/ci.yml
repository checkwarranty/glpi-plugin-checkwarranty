name: GLPI Plugin CI & Release

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: PHP Lint & Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, gettext
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP Syntax Lint
        run: bash tools/lint.sh

      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install -y gettext zip

      - name: Release regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Build installable archives
        run: bash tools/package.sh

  release:
    name: Build & Publish Release Assets
    needs: lint
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, gettext

      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install -y gettext zip

      - name: Package Release Archives
        run: |
          bash tools/package.sh "${GITHUB_REF#refs/tags/}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/glpi-checkwarranty-*.tar.gz
            dist/glpi-checkwarranty-*.zip
            dist/glpi-checkwarranty-*.sha256
          generate_release_notes: true
          draft: true
          prerelease: true
